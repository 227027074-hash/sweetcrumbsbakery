
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category | Sweet Crumbs Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">

<header>
    <h1>Sweet Crumbs Bakery</h1>
    <p>Freshly Baked with Love 💜</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Our Products</a>
    <a href="about.html">About Us</a>
    <a href="reviews.html">Reviews</a>
    <a href="contact.html">Contact</a>
    <a href="order.html">Your Orders</a>

    <a href="cart.html">
        🛒 Cart (<span id="cartCount">0</span>)
    </a>

    <a href="wishlist.html">
        ♡ Wishlist (<span id="wishCount">0</span>)
    </a>
</nav>

<section id="products">

    <a href="products.html" class="back-category">
        ← Back to Categories
    </a>

    <h2 id="categoryTitle">Our Varieties</h2>

    <div class="product-controls">
        <input type="search" id="search"
               placeholder="Search products...">

        <select id="sort">
            <option value="default">Default Order</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="name">Name: A to Z</option>
        </select>
    </div>

    <div class="products" id="productList"></div>

</section>

<dialog id="productDialog">
    <button id="closeDetails" class="close-btn" type="button">
        ✕ Close
    </button>
    <div id="productDetails"></div>
</dialog>

<footer>
    <p>© 2026 Sweet Crumbs Bakery 💜</p>
</footer>

<script src="script.js"></script>

</body>
</html>
